<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">WiFi 文件传输</title>
<!-- CONFIG_PLACEHOLDER -->
<style>
:root {
    --primary: #14B409;
    --primary-dark: #0F8C07;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --border: #d2d2d7;
    --success: #14B409;
    --error: #ff3b30;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1c1c1e;
        --card-bg: #2c2c2e;
        --text: #e5e5e7;
        --text-secondary: #98989d;
        --border: #48484a;
        --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
}

.container {
    width: 100%;
    max-width: 640px;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 36px;
}

.header .logo {
    width: 64px;
    height: 64px;
    background: var(--primary);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(20, 180, 9, 0.35);
}

.header .logo svg {
    width: 36px;
    height: 36px;
    fill: white;
}

.header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
}

.header p {
    font-size: 15px;
    color: var(--text-secondary);
    margin-top: 4px;
}

/* Drop Zone */
.dropzone {
    background: var(--card-bg);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
}

.dropzone:hover,
.dropzone.drag-over {
    border-color: var(--primary);
    background: rgba(20, 180, 9, 0.04);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(20, 180, 9, 0.15);
}

.dropzone.drag-over {
    border-style: solid;
    background: rgba(20, 180, 9, 0.06);
}

.dropzone .icon {
    width: 36px;
    height: 36px;
    margin: 0 auto 8px;
    color: var(--primary);
}

.dropzone .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
}

/* File List (upload progress) */
.file-list {
    margin-bottom: 24px;
}

.file-list.empty {
    display: none;
}

.file-item {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    animation: slideIn 0.3s ease;
    border: 1px solid var(--border);
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.file-item .file-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.file-item .file-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
}

.file-item .file-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.file-item .file-icon svg {
    width: 18px;
    height: 18px;
    fill: white;
}

.file-item .file-icon.success { background: var(--success); }
.file-item .file-icon.error { background: var(--error); }
.file-item .file-icon.uploading { background: var(--primary); }

.file-item .file-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.file-item .file-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.file-item .file-status {
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-left: 12px;
}

.file-item .file-status.uploading { color: var(--primary); }
.file-item .file-status.success { color: var(--success); }
.file-item .file-status.error { color: var(--error); }

.progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
}

.progress-bar .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
}

.progress-bar .progress-fill.success { background: var(--success); }
.progress-bar .progress-fill.error { background: var(--error); }

/* ---- File Manager ---- */

.fm-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.fm-toolbar .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.fm-toolbar .btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.fm-toolbar .btn svg {
    width: 16px;
    height: 16px;
}


.breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: var(--card-bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    overflow-x: auto;
    white-space: nowrap;
    font-size: 14px;
    box-shadow: var(--shadow);
}

.breadcrumb-item {
    color: var(--primary);
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.15s;
}

.breadcrumb-item:hover {
    opacity: 0.7;
}

.breadcrumb-item:last-child {
    color: var(--text);
    cursor: default;
    font-weight: 600;
}

.breadcrumb-item:last-child:hover {
    opacity: 1;
}

.breadcrumb-sep {
    color: var(--text-secondary);
    margin: 0 2px;
}

.fm-list {
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
}

.fm-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
}

.fm-item:last-child {
    border-bottom: none;
}

.fm-item:hover {
    background: rgba(20, 180, 9, 0.04);
}

.fm-item-main {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
}

.fm-item-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.fm-item-icon svg {
    width: 24px;
    height: 24px;
}

.fm-item.is-dir .fm-item-icon {
    color: var(--primary);
}

.fm-item:not(.is-dir) .fm-item-icon {
    color: var(--text-secondary);
}

.fm-item-info {
    min-width: 0;
    flex: 1;
}

.fm-item-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fm-item-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
}

.fm-item-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-left: 8px;
}

.fm-action-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.fm-action-btn:hover {
    background: rgba(20, 180, 9, 0.1);
    color: var(--primary);
}

.fm-action-btn svg {
    width: 16px;
    height: 16px;
}

.delete-btn:hover {
    background: rgba(255, 59, 48, 0.1);
    color: var(--error);
}

.empty-dir {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-secondary);
    font-size: 14px;
}

/* ---- Modal ---- */

.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    animation: modalIn 0.2s ease;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-card h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 16px 0;
    color: var(--text);
}

.modal-card p {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 0 0 20px 0;
    word-break: break-all;
}

.modal-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
}

.modal-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(20, 180, 9, 0.15);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.modal-btn {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
}

.modal-btn-cancel {
    background: var(--border);
    color: var(--text);
}

.modal-btn-cancel:hover {
    opacity: 0.8;
}

.modal-btn-confirm {
    background: var(--primary);
    color: #fff;
}

.modal-btn-confirm:hover {
    background: var(--primary-dark);
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 32px;
    padding: 16px 0;
}

.footer a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
}

.footer a:hover {
    color: var(--primary);
}

#fileInput, #folderInput { display: none; }

.upload-wrapper {
    position: relative;
    display: inline-flex;
}

.upload-caret {
    width: 14px;
    height: 14px;
    margin-left: 2px;
    opacity: 0.5;
}

.upload-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    z-index: 100;
    min-width: 130px;
    overflow: hidden;
}

.upload-dropdown.show {
    display: block;
}

.dropdown-item {
    display: block;
    width: 100%;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
}

.dropdown-item:hover {
    background: rgba(20, 180, 9, 0.08);
    color: var(--primary);
}

.dropdown-item + .dropdown-item {
    border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<div class="container">

<div class="header">
    <div class="logo">
        <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>
    <h1 id="appName"></h1>
    <p id="pageSubtitle"></p>
</div>

<!-- Drop Zone -->
<div class="dropzone" id="dropzone">
    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
    </div>
    <div class="title" id="dropTitle"></div>
</div>

<input type="file" id="fileInput" multiple/>
<input type="file" id="folderInput" webkitdirectory/>

<!-- Upload Progress -->
<div class="file-list empty" id="fileList"></div>

<!-- File Manager Toolbar -->
<div class="fm-toolbar">
    <div class="upload-wrapper">
        <button class="btn" id="uploadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span id="uploadBtnLabel">上传</span>
            <svg class="upload-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="upload-dropdown" id="uploadDropdown">
            <button class="dropdown-item" id="uploadFileItem"></button>
            <button class="dropdown-item" id="uploadFolderItem"></button>
        </div>
    </div>
    <button class="btn" id="newFolderBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        <span id="newFolderBtnLabel">新建文件夹</span>
    </button>
</div>

<div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-item" data-path="/">Home</span>
</div>

<div class="fm-list" id="fileManagerList">
    <div class="empty-dir" id="loadingMsg">加载中...</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
            <button class="modal-btn modal-btn-confirm" id="modalConfirm">确认</button>
        </div>
    </div>
</div>

<div class="footer">
    <a href="https://www.dandanplay.com" target="_blank" rel="noopener">www.dandanplay.com</a>
</div>

</div>

<script src="upload.js"></script>
<script src="fileManager.js"></script>
</body>
</html>
