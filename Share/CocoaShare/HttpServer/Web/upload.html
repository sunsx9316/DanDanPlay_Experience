<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">WiFi 文件传输</title>
<!-- CONFIG_PLACEHOLDER -->
<style>
:root {
    --primary: #14B409;
    --primary-dark: #0F8C07;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --border: #d2d2d7;
    --success: #14B409;
    --error: #ff3b30;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1c1c1e;
        --card-bg: #2c2c2e;
        --text: #e5e5e7;
        --text-secondary: #98989d;
        --border: #48484a;
        --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
}

.container {
    width: 100%;
    max-width: 640px;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 36px;
}

.header .logo {
    width: 64px;
    height: 64px;
    background: var(--primary);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(20, 180, 9, 0.35);
}

.header .logo svg {
    width: 36px;
    height: 36px;
    fill: white;
}

.header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
}

.header p {
    font-size: 15px;
    color: var(--text-secondary);
    margin-top: 4px;
}

/* Drop Zone */
.dropzone {
    background: var(--card-bg);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: var(--shadow);
}

.dropzone:hover,
.dropzone.drag-over {
    border-color: var(--primary);
    background: rgba(20, 180, 9, 0.04);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(20, 180, 9, 0.15);
}

.dropzone.drag-over {
    border-style: solid;
    background: rgba(20, 180, 9, 0.06);
}

.dropzone .icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    color: var(--primary);
}

.dropzone .title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
}

.dropzone .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
}

.dropzone .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

.dropzone .browse-btn {
    display: inline-block;
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    text-decoration: none;
}

.dropzone .browse-btn:hover {
    background: var(--primary-dark);
    transform: scale(1.03);
    box-shadow: 0 2px 10px rgba(20, 180, 9, 0.4);
}

.dropzone .browse-btn:active {
    transform: scale(0.97);
}

/* File List */
.file-list {
    margin-top: 24px;
}

.file-list.empty {
    display: none;
}

.file-item {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    animation: slideIn 0.3s ease;
    border: 1px solid var(--border);
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.file-item .file-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.file-item .file-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
}

.file-item .file-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.file-item .file-icon svg {
    width: 18px;
    height: 18px;
    fill: white;
}

.file-item .file-icon.success { background: var(--success); }
.file-item .file-icon.error { background: var(--error); }
.file-item .file-icon.uploading { background: var(--primary); }

.file-item .file-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.file-item .file-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.file-item .file-status {
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-left: 12px;
}

.file-item .file-status.uploading { color: var(--primary); }
.file-item .file-status.success { color: var(--success); }
.file-item .file-status.error { color: var(--error); }

.progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
}

.progress-bar .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
}

.progress-bar .progress-fill.success { background: var(--success); }
.progress-bar .progress-fill.error { background: var(--error); }

/* Footer */
.footer {
    text-align: center;
    margin-top: 32px;
    padding: 16px 0;
}

.footer a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
}

.footer a:hover {
    color: var(--primary);
}

#fileInput, #folderInput { display: none; }
</style>
</head>
<body>
<div class="container">

<div class="header">
    <div class="logo">
        <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
    </div>
    <h1 id="appName"></h1>
    <p id="pageSubtitle"></p>
</div>

<div class="dropzone" id="dropzone">
    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
    </div>
    <div class="title" id="dropTitle"></div>
    <div class="subtitle" id="dropSubtitle"></div>
    <div class="buttons">
        <button class="browse-btn" id="browseFileBtn"></button>
        <button class="browse-btn" id="browseFolderBtn"></button>
    </div>
</div>

<input type="file" id="fileInput" multiple/>
<input type="file" id="folderInput" webkitdirectory/>

<div class="file-list empty" id="fileList"></div>

<div class="footer">
    <a href="https://www.dandanplay.com" target="_blank" rel="noopener">www.dandanplay.com</a>
</div>

</div>

<script src="upload.js"></script>
</body>
</html>
